name: Release
# Pushing a tag such as v0.4 builds the ARM64 APK, checks it, and publishes the GitHub release
# with the matching CHANGELOG section as notes.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  # Every release is signed with the same key so installed copies update in place.
  EXPECTED_CERT_SHA256: 795d0e31f1f39a6abb8334fd4dc0d82ccb7d60b253c2807356fe84c211c66b80
  BUILD_TOOLS: 35.0.0
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;$BUILD_TOOLS"'
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag against the app version and the changelog
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          grep -q "versionName = \"$version\"" app/build.gradle.kts \
            || { echo "::error::$tag does not match versionName in app/build.gradle.kts"; exit 1; }
          heading=$(grep -m1 "^## $tag " CHANGELOG.md || grep -m1 "^## $tag\$" CHANGELOG.md || true)
          [ -n "$heading" ] || { echo "::error::CHANGELOG.md has no '## $tag' section"; exit 1; }
          awk -v head="$heading" '$0 == head {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::The $tag section in CHANGELOG.md is empty"; exit 1; }
          echo "title=Media Studio ${heading#\#\# }" >> "$GITHUB_OUTPUT"
          echo "apk=media-studio-$tag-arm64-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::Secret DEBUG_KEYSTORE_BASE64 is missing"; exit 1; }
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Verify the APK
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          cert=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          [ "$cert" = "$EXPECTED_CERT_SHA256" ] \
            || { echo "::error::Unexpected signing certificate $cert"; exit 1; }
          "$tools/aapt2" dump badging "$apk" | grep -q "versionName='${GITHUB_REF_NAME#v}'" \
            || { echo "::error::APK versionName does not match the tag"; exit 1; }
          abis=$(unzip -l "$apk" | grep -o 'lib/[^/]*/' | sort -u | tr '\n' ' ')
          [ "$abis" = "lib/arm64-v8a/ " ] || { echo "::error::Unexpected ABIs: $abis"; exit 1; }
          mkdir dist
          cp "$apk" "dist/${{ steps.meta.outputs.apk }}"
          (cd dist && sha256sum "${{ steps.meta.outputs.apk }}" > SHA256SUMS && cat SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "${{ steps.meta.outputs.title }}" --notes-file notes.md \
            "dist/${{ steps.meta.outputs.apk }}" dist/SHA256SUMS
